<div class="dashboard">

  <!-- TOP BAR -->
  <header class="top-bar">
    <h1>Customer Dashboard</h1>

    <div class="top-actions">
      <!-- Search -->
      <div class="search-box">
        <span class="icon">🔍</span>
        <form [formGroup]="searchForm">
          <input formControlName="searchText" matInput placeholder="Search anything..." type="text"/>
        </form>
      </div>

      <!-- Orders -->
      <button (click)="loadOrdersData()" class="orders-btn" routerLink="/CustomerDashboard">Your Orders</button>

      <!-- Cart -->
      <button (click)="openModal()" class="icon-btn cart-btn">
        <mat-icon>add_shopping_cart</mat-icon>
        <span class="badge">{{ buyingCartService.cartData.numberOfItems }}</span>
      </button>

      <!-- Logout -->
      <button (click)="logout()" class="icon-btn logout-btn">
        ⎋ Logout
      </button>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="content">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="profile">
          <img [src]="localStorageService.getCookie('userPic')" alt="User"/>
          <h3>{{ localStorageService.getCookie('userEmail') }} </h3>
          <span>Customer</span>
        </div>

        <nav>
          <button (click)="loadData('CLOTHES')" class="nav-item" routerLink="sub-01/clothes" routerLinkActive="active">
            👕 <span>Clothes</span></button>
          <button (click)="loadData('BOOKS')" class="nav-item" routerLink="sub-01/books" routerLinkActive="active">📚
            <span>Books</span></button>
          <button (click)="loadData('ELECTRONICS')" class="nav-item" routerLink="sub-01/electronics"
                  routerLinkActive="active">💻 <span>Electronics</span></button>
          <button (click)="loadData('ELECTRICAL')" class="nav-item" routerLink="sub-01/electrical"
                  routerLinkActive="active">⚡ <span>Electrical</span></button>
          <button (click)="loadData('COSMETICS')" class="nav-item" routerLink="sub-02/cosmetics"
                  routerLinkActive="active">💄 <span>Cosmetics</span></button>
          <button (click)="loadData('OTHER')" class="nav-item" routerLink="sub-02/other" routerLinkActive="active">📦
            <span>Other</span></button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        &copy;{{ this.year }} AngShop
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="inner-components">
        <div class="content-text-inner">
          <h2 class="section-title">Recommended for You</h2>
        </div>
        <div class="content-data-inner">
          <app-loading *ngIf="loadingService.progressBarLoadingState |async" [data]="type"></app-loading>
          <div class="layout-grid">
            <app-order *ngIf="orderButtonClicked" [data]="this.dashboardService.dataList"></app-order>
            <router-outlet></router-outlet>
          </div>
        </div>

      </div>

      <!-- Pagination -->
      <div class="pagination">
        <mat-paginator (page)="pageEvent=loadServerData($event,clickedBtnName,orderButtonClicked)"
                       [length]=this.dashboardService.dataCount [pageIndex]=page [pageSizeOptions]=pageSizeOptions
                       [pageSize]=pageSize
                       aria-label="Select Page">

        </mat-paginator>
      </div>
    </main>

  </div>
</div>
