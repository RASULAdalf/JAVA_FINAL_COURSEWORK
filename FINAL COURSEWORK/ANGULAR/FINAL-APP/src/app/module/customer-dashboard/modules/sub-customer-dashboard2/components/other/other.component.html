<div #viewButton *ngFor="let data of this.customerDashboardService.dataList; index as num" [attr.data-index]="num"
     class="other-element">
  <div class="header"><h2>{{ data?.itemDescription }}</h2></div>
  <div [ngStyle]="{ background: data?.itemLogoUrl | customerDashboardBackgroundImages,'background-size':'cover'}"
       class="image"></div>
  <div class="price">Rs.{{ data?.unitPrice }}.00</div>
  <div class="view-details">
    <button (click)="openModal(viewButton)" color="primary" mat-raised-button>VIEW</button>
    <button mat-button matTooltip="Reviews">
      <mat-icon>reviews</mat-icon>
    </button>
  </div>
</div>
