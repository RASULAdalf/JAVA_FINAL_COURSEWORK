<div class="content-outer">
  <div class="header-outer">
    <button (click)="openEditModal(-1)" color="accent" mat-raised-button>+ ADD NEW PRODUCT</button>
  </div>
  <div class="data-inner">
    <mat-card *ngFor="let data of data; index as num" appearance="outlined" class="example-card">
      <mat-card-header>
        <mat-card-title>{{ data?.itemDescription }}</mat-card-title>
        <mat-card-subtitle>{{ data?.itemCategory }}</mat-card-subtitle>
      </mat-card-header>
      <img [src]="data?.itemLogoUrl" alt="Picture" class="card-content" mat-card-image
           style="background-size: contain!important; ">
      <mat-card-actions class="card-content">
        <button (click)="openViewModal(num)" color="primary" mat-raised-button>VIEW</button>
        <button (click)="openEditModal(num)" color="primary" mat-raised-button>UPDATE</button>
        <button (click)="deleteProduct(data?.itemCode)" color="warn" mat-raised-button>DELETE</button>
        <br>
        <mat-chip-list>
          <mat-chip>Rs.{{ data?.unitPrice }}</mat-chip>
        </mat-chip-list>
      </mat-card-actions>

    </mat-card>
  </div>
</div>
