<div class="auth-page">
  <div class="auth-card">
    <h2>Create your Buynest account</h2>
    <p class="subtitle">Join and start selling</p>

    <input [(ngModel)]="email" placeholder="Email" type="email"/>
    <input [(ngModel)]="password" placeholder="Password" type="password"/>
    <input [(ngModel)]="confirmPassword" placeholder="Confirm Password" type="password"/>

    <button (click)="register()" [disabled]="loading">
      {{ loading ? 'Creating account...' : 'Register' }}
    </button>

    <div class="divider">OR</div>

    <button (click)="googleSignup()" class="google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg"/>
      Sign up with Google
    </button>

    <p class="footer">
      Already have an account?
      <a routerLink="/VendorDashboard/login">Login</a>
    </p>
  </div>
</div>
