<div class="row col-sm-12">
  <div class="header-outer">
    <div class="header-text">
      <h2 class="header-text">Vendor Dashboard</h2>
      <mat-chip-list>
        <mat-chip class="orders-button" color="primary">Total Earnings:
          Rs {{ this.vendorDashboardService.totalEarnings }}
        </mat-chip>
      </mat-chip-list>

    </div>
    <div class="header-buttons">
      <button (click)="this.logout()" aria-label="Example icon button with a logout icon" mat-button>
        <mat-icon class="logout-button">logout</mat-icon>
      </button>

      <button (click)="this.openMail()" aria-label="Example icon button with a mail icon" class="mail-button" mat-button
              matTooltip="Messaging will be available soon">
        <mat-icon [matBadge]="0">mail</mat-icon>
      </button>
      <button (click)="this.modalService.openItemEditModal([{vendorEmail: this.vendorDashboardService.vendorEmail}], 0, 'Save')"
              aria-label="Example icon button with a add icon"
              class="add-button" mat-button matTooltip="Add new Product">
        <mat-icon class="add-button">add_2</mat-icon>
      </button>


    </div>

  </div>
  <div class="all-content-outer">
    <div class="menu-outer">
      <div *ngIf="this.vendorDashboardService.vendorEmail!=undefined && this.vendorDashboardService.vendorEmail!=null"
           class="account-outer">
        <div class="account-logo">
          <div [ngStyle]="{ background: this.vendorImage| vendorDashboardBackgroundImages,'background-size':'cover'}"
               class="logo-box"></div>
        </div>
        <div class="account-name">{{ this.vendorDashboardService.vendorEmail }}</div>
      </div>
      <div class="menu-items-outer">
        <mat-button-toggle-group #chooseMenuItem="matButtonToggleGroup" [(ngModel)]="chooseMenuItemValue"
                                 appearance="standard"
                                 aria-label="menu-label">
          <mat-button-toggle (click)="this.vendorDashboardService.loadData('ORDERS',this.page,this.pageSize)"
                             aria-orientation="vertical" value="ORDERS">ORDERS
          </mat-button-toggle>
          <mat-button-toggle (click)="this.vendorDashboardService.loadData('PRODUCTS',this.page,this.pageSize)"
                             aria-orientation="vertical" value="PRODUCTS">PRODUCTS
          </mat-button-toggle>
          <mat-button-toggle (click)="this.vendorDashboardService.loadData('CLIENTS',this.page,this.pageSize)"
                             aria-orientation="vertical" value="CLIENTS">CLIENTS
          </mat-button-toggle>
          <mat-button-toggle (click)="this.vendorDashboardService.loadData('EARNINGS',this.page,this.pageSize)"
                             aria-orientation="vertical" value="EARNINGS">EARNINGS
          </mat-button-toggle>
          <mat-button-toggle (click)="this.vendorDashboardService.loadData('ANALYSIS',this.page,this.pageSize)"
                             aria-orientation="vertical" value="ANALYSIS">ANALYSIS
          </mat-button-toggle>
        </mat-button-toggle-group>
      </div>
      <div class="copyright-outer">
        <small>&copy;{{ year }}</small>&nbsp;
        <small>All rights reserved</small>
      </div>
    </div>
    <div class="content-outer">
      <div class="search-bar-outer">
        <div class="search-bar-inner">
          <div class="icon-inner"><i class="fa-brands fa-searchengin w3-xxlarge"></i></div>
          <div class="text-inner">
            <form [formGroup]="searchForm">
              <input [style.height.px]="43" [style.width.%]="100" formControlName="searchText" matInput
                     placeholder="Enter search Text"
                     type="text">
            </form>
          </div>
        </div>
      </div>
      <div class="content-inner">
        <app-loading *ngIf="loadingService.progressBarLoadingState |async" [data]="type"></app-loading>
        <app-orders *ngIf="chooseMenuItem.value=='ORDERS' || chooseMenuItem.value==undefined "
                    [data]="this.vendorDashboardService.dataList"
                    class="inner-components"></app-orders>
        <app-products *ngIf="chooseMenuItem.value=='PRODUCTS' " [data]="this.vendorDashboardService.dataList"
                      [pageSize]="pageSize" [page]="page"
                      [vendorEmail]="this.vendorDashboardService.vendorEmail" class="inner-components"></app-products>
        <app-clients *ngIf="chooseMenuItem.value=='CLIENTS' " [buttonName]="buttonName"
                     [data]="this.vendorDashboardService.dataList"
                     class="inner-components"></app-clients>
        <app-earnings *ngIf="chooseMenuItem.value=='EARNINGS'" [buttonName]="buttonName"
                      [data]="this.vendorDashboardService.dataList"
                      class="inner-components"></app-earnings>
        <app-analysis *ngIf="chooseMenuItem.value=='ANALYSIS'" [buttonName]="buttonName"
                      [data]="this.vendorDashboardService.dataList"
                      class="inner-components"></app-analysis>
      </div>

      <div class="paginator-outer">
        <mat-paginator (page)="pageEvent=loadServerData($event,chooseMenuItem.value)"
                       [length]=this.vendorDashboardService.dataCount
                       [pageIndex]=page [pageSizeOptions]=pageSizeOptions
                       [pageSize]=pageSize aria-label="Select Page">

        </mat-paginator>
      </div>
    </div>


  </div>
</div>
