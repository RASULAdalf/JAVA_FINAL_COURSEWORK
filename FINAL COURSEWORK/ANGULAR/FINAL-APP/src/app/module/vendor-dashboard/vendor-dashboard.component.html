<div class="row col-sm-12">
  <div class="header-outer">
    <h2 class="header-text">Vendor Dashboard</h2>
    <div class="header-buttons">
           <button mat-button (click)="this.logout()" aria-label="Example icon button with a logout icon">
        <mat-icon class="logout-button">logout</mat-icon>
      </button>
      <button mat-button="outlined" #orderBtn class="orders-button" color="accent">{{totalEarnings}}</button>
    </div>

  </div>
  <div class="all-content-outer">
    <div class="menu-outer">
      <div class="account-outer" *ngIf="vendorEmail!=undefined && vendorEmail!=null">
        <div class="account-logo">
          <div class="logo-box" [ngStyle]="{ background: this.vendorImage| vendorDashboardBackgroundImages,'background-size':'cover'}"></div>
        </div>
        <div class="account-name">{{this.vendorEmail}}</div>
      </div>
      <div class="menu-items-outer"><mat-button-toggle-group #chooseMenuItem="matButtonToggleGroup" aria-label="menu-label" appearance="standard" >
        <mat-button-toggle value="ORDERS" aria-orientation="vertical" (click)="loadData('ORDERS')">ORDERS</mat-button-toggle>
        <mat-button-toggle value="PRODUCTS" aria-orientation="vertical" (click)="loadData('PRODUCTS')">PRODUCTS</mat-button-toggle>
        <mat-button-toggle value="CLIENTS" aria-orientation="vertical" (click)="loadData('CLIENTS')">CLIENTS</mat-button-toggle>
        <mat-button-toggle value="EARNINGS" aria-orientation="vertical" (click)="loadData('EARNINGS')">EARNINGS</mat-button-toggle>
        <mat-button-toggle value="ANALYSIS" aria-orientation="vertical" (click)="loadData('ANALYSIS')">ANALYSIS</mat-button-toggle>
       </mat-button-toggle-group></div>
      <div class="copyright-outer">
        <small>&copy;{{year}}</small>&nbsp;
        <small>All rights reserved</small>
      </div>
    </div>
    <div class="content-outer">
      <div class="content-inner">
        <app-loading *ngIf="loadingService.progressBarLoadingState |async" [data]="type"></app-loading>
        <app-orders class="inner-components" *ngIf="chooseMenuItem.value=='ORDERS' " [data]="dataList"></app-orders>
        <app-products class="inner-components" *ngIf="chooseMenuItem.value=='PRODUCTS' " [data]="dataList" [page]="page" [pageSize]="pageSize" [vendorEmail]="vendorEmail"></app-products>
        <app-clients class="inner-components" *ngIf="chooseMenuItem.value=='CLIENTS' " [data]="dataList" [buttonName]="buttonName"></app-clients>
        <app-earnings class="inner-components" *ngIf="chooseMenuItem.value=='EARNINGS'" [data]="dataList" [buttonName]="buttonName"></app-earnings>
        <app-analysis class="inner-components" *ngIf="chooseMenuItem.value=='ANALYSIS'" [data]="dataList" [buttonName]="buttonName"></app-analysis>
      </div>

      <div class="paginator-outer">
        <mat-paginator [length]=dataCount [pageSize]=pageSize [pageIndex]=page [pageSizeOptions]=pageSizeOptions  aria-label="Select Page" (page)="pageEvent=loadServerData($event,chooseMenuItem.value)">

        </mat-paginator>
      </div>
    </div>


  </div>
</div>
