<div class="row col-sm-12">
  <div class="header-outer">
    <h2 class="header-text">Vendor Dashboard</h2>
    <div class="header-buttons">
           <button mat-button (click)="this.logout()" aria-label="Example icon button with a logout icon">
        <mat-icon class="logout-button">logout</mat-icon>
      </button>
      <button mat-button="outlined" #orderBtn class="orders-button" color="accent">{{totalEarnings}}</button>
    </div>

  </div>
  <div class="all-content-outer">
    <div class="menu-outer">
      <div class="account-outer" *ngIf="vendorEmail!=undefined && vendorEmail!=null">
        <div class="account-logo">
          <div class="logo-box" [ngStyle]="{ background: this.vendorImage| vendorDashboardBackgroundImages,'background-size':'cover'}"></div>
        </div>
        <div class="account-name">{{this.vendorEmail}}</div>
      </div>
      <div class="menu-items-outer"><mat-button-toggle-group #chooseMenuItem="matButtonToggleGroup" aria-label="menu-label" appearance="standard" >
        <mat-button-toggle value="ORDERS" aria-orientation="vertical" (click)="loadData('CLOTHES')">ORDERS</mat-button-toggle>
        <mat-button-toggle value="PRODUCTS" aria-orientation="vertical" (click)="loadData('BOOKS')">PRODUCTS</mat-button-toggle>
        <mat-button-toggle value="CLIENTS" aria-orientation="vertical" (click)="loadData('ELECTRONICS')">CLIENTS</mat-button-toggle>
        <mat-button-toggle value="EARNINGS" aria-orientation="vertical" (click)="loadData('ELECTRICAL')">EARNINGS</mat-button-toggle>
        <mat-button-toggle value="ANALYSIS" aria-orientation="vertical" (click)="loadData('COSMETICS')">ANALYSIS</mat-button-toggle>
       </mat-button-toggle-group></div>
      <div class="copyright-outer">
        <small>&copy;{{year}}</small>&nbsp;
        <small>All rights reserved</small>
      </div>
    </div>
    <div class="content-outer">
      <div class="content-inner">
        <app-loading *ngIf="loadingService.progrssBarLoadingState |async" [data]="type"></app-loading>
        <app-orders class="inner-components" *ngIf="chooseMenuItem.value=='ORDERS' && !orderButtonClicked" [data]="dataList" [buttonName]="buttonName"></app-orders>
        <app-products class="inner-components" *ngIf="chooseMenuItem.value=='PRODUCTS' && !orderButtonClicked" [data]="dataList" [buttonName]="buttonName"></app-products>
        <app-clients class="inner-components" *ngIf="chooseMenuItem.value=='CLIENTS' && !orderButtonClicked" [data]="dataList" [buttonName]="buttonName"></app-clients>
        <app-earnings class="inner-components" *ngIf="chooseMenuItem.value=='EARNINGS'&& !orderButtonClicked" [data]="dataList" [buttonName]="buttonName"></app-earnings>
        <app-analysis class="inner-components" *ngIf="chooseMenuItem.value=='ANALYSIS'&& !orderButtonClicked" [data]="dataList" [buttonName]="buttonName"></app-analysis>
      </div>

      <div class="paginator-outer">
<!--        <mat-paginator [length]=dataCount [pageSize]=pageSize [pageIndex]=page [pageSizeOptions]=pageSizeOptions  aria-label="Select Page" (page)="pageEvent=loadServerData($event,chooseMenuItem.value,orderButtonClicked)">-->

<!--        </mat-paginator>-->
      </div>
    </div>


  </div>
</div>
