<div class="row col-sm-12">
  <div class="header-outer">
    <h2 class="header-text">Vendor Dashboard</h2>
    <div class="header-buttons">
      <button (click)="this.logout()" aria-label="Example icon button with a logout icon" mat-button>
        <mat-icon class="logout-button">logout</mat-icon>
      </button>
      <button #orderBtn class="orders-button" color="accent" mat-button="outlined">{{ totalEarnings }}</button>
    </div>

  </div>
  <div class="all-content-outer">
    <div class="menu-outer">
      <div *ngIf="vendorEmail!=undefined && vendorEmail!=null" class="account-outer">
        <div class="account-logo">
          <div [ngStyle]="{ background: this.vendorImage| vendorDashboardBackgroundImages,'background-size':'cover'}"
               class="logo-box"></div>
        </div>
        <div class="account-name">{{ this.vendorEmail }}</div>
      </div>
      <div class="menu-items-outer">
        <mat-button-toggle-group #chooseMenuItem="matButtonToggleGroup" appearance="standard" aria-label="menu-label" [(ngModel)]="chooseMenuItemValue">
          <mat-button-toggle (click)="loadData('ORDERS')" aria-orientation="vertical" value="ORDERS">ORDERS
          </mat-button-toggle>
          <mat-button-toggle (click)="loadData('PRODUCTS')" aria-orientation="vertical" value="PRODUCTS">PRODUCTS
          </mat-button-toggle>
          <mat-button-toggle (click)="loadData('CLIENTS')" aria-orientation="vertical" value="CLIENTS">CLIENTS
          </mat-button-toggle>
          <mat-button-toggle (click)="loadData('EARNINGS')" aria-orientation="vertical" value="EARNINGS">EARNINGS
          </mat-button-toggle>
          <mat-button-toggle (click)="loadData('ANALYSIS')" aria-orientation="vertical" value="ANALYSIS">ANALYSIS
          </mat-button-toggle>
        </mat-button-toggle-group>
      </div>
      <div class="copyright-outer">
        <small>&copy;{{ year }}</small>&nbsp;
        <small>All rights reserved</small>
      </div>
    </div>
    <div class="content-outer">
      <div class="search-bar-outer">
        <div class="search-bar-inner">
          <div class="icon-inner"><i class="fa-brands fa-searchengin w3-xxlarge"></i></div>
          <div class="text-inner">
            <form [formGroup]="searchForm">
              <input [style.height.px]="43" [style.width.%]="100" formControlName="searchText" matInput
                     placeholder="Enter search Text"
                     type="text">
            </form>
          </div>
        </div>
      </div>
      <div class="content-inner">
        <app-loading *ngIf="loadingService.progressBarLoadingState |async" [data]="type"></app-loading>
        <app-orders *ngIf="chooseMenuItem.value=='ORDERS' " [data]="dataList" class="inner-components"></app-orders>
        <app-products *ngIf="chooseMenuItem.value=='PRODUCTS' " [data]="dataList" [pageSize]="pageSize" [page]="page"
                      [vendorEmail]="vendorEmail" class="inner-components"></app-products>
        <app-clients *ngIf="chooseMenuItem.value=='CLIENTS' " [buttonName]="buttonName" [data]="dataList"
                     class="inner-components"></app-clients>
        <app-earnings *ngIf="chooseMenuItem.value=='EARNINGS'" [buttonName]="buttonName" [data]="dataList"
                      class="inner-components"></app-earnings>
        <app-analysis *ngIf="chooseMenuItem.value=='ANALYSIS'" [buttonName]="buttonName" [data]="dataList"
                      class="inner-components"></app-analysis>
      </div>

      <div class="paginator-outer">
        <mat-paginator (page)="pageEvent=loadServerData($event,chooseMenuItem.value)" [length]=dataCount [pageIndex]=page [pageSizeOptions]=pageSizeOptions
                       [pageSize]=pageSize aria-label="Select Page">

        </mat-paginator>
      </div>
    </div>


  </div>
</div>
