<div class="dashboard">

  <!-- TOP BAR -->
  <header class="top-bar">
    <h1>Vendor Dashboard</h1>

    <div class="top-actions">
      <!-- Search -->
      <div class="search-box">
        <span class="icon">🔍</span>
        <form [formGroup]="searchForm">
          <input formControlName="searchText" matInput placeholder="Search anything..." type="text"/>
        </form>
      </div>

      <!-- Orders -->
      <button (click)="this.vendorDashboardService.loadData('ORDERS',this.page,this.pageSize)" class="orders-btn"
              routerLink="/CustomerDashboard">Orders
      </button>

      <!-- Cart -->
      <!--      <button  (click)="openModal()" class="icon-btn cart-btn">-->
      <!--        <mat-icon>add_shopping_cart</mat-icon>-->
      <!--        <span class="badge">{{buyingCartService.cartData.numberOfItems}}</span>-->
      <!--      </button>-->

      <!-- Logout -->
      <button (click)="logout()" class="icon-btn logout-btn">
        ⎋ Logout
      </button>
    </div>
  </header>

  <!-- CONTENT -->
  <div class="content">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="profile">
          <img [src]="this.vendorImage" alt="User"/>
          <h3>{{ this.vendorDashboardService.vendorEmail }}</h3>
          <span>Vendor</span>
        </div>

        <nav>
          <button (click)="loadData('PRODUCTS',this.page,this.pageSize)" class="nav-item" queryParamsHandling="preserve"
                  routerLink="products" routerLinkActive="active">📦 <span>Products</span></button>
          <button (click)="loadData('ORDERS',this.page,this.pageSize)" class="nav-item" queryParamsHandling="preserve"
                  routerLink="orders" routerLinkActive="active">🧾 <span>Orders</span></button>
          <button (click)="loadData('CLIENTS',this.page,this.pageSize)" class="nav-item" queryParamsHandling="preserve"
                  routerLink="clients" routerLinkActive="active">👥 <span>Clients</span></button>
          <button (click)="loadData('EARNINGS',this.page,this.pageSize)" class="nav-item" queryParamsHandling="preserve"
                  routerLink="earnings" routerLinkActive="active">💰 <span>Earnings</span></button>
          <button (click)="loadData('ANALYSIS',this.page,this.pageSize)" class="nav-item" queryParamsHandling="preserve"
                  routerLink="analysis" routerLinkActive="active">📊 <span>Analysis</span></button>
        </nav>
      </div>
      <div class="sidebar-bottom">
        &copy;{{ this.year }} AngShop
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="inner-components">
        <div class="content-data-inner">
          <app-loading *ngIf="loadingService.progressBarLoadingState |async" [data]="type"></app-loading>
          <div class="layout-grid">
            <!--            <app-order *ngIf="orderButtonClicked" [data]="this.vendorDashboardService.dataList"></app-order>-->
            <router-outlet></router-outlet>
          </div>
        </div>

      </div>

      <!-- Pagination -->
      <div class="pagination">
        <mat-paginator (page)="pageEvent=loadServerData($event,clickedBtnName)"
                       [length]=this.vendorDashboardService.dataCount [pageIndex]=page [pageSizeOptions]=pageSizeOptions
                       [pageSize]=pageSize
                       aria-label="Select Page">

        </mat-paginator>
      </div>
    </main>

  </div>
</div>
