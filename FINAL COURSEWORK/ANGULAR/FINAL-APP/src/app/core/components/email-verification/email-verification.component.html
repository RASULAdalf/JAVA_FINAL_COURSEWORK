<div class="verification-page">

  <div class="card">

    <div class="icon">
      📧
    </div>

    <h1 mat-dialog-title>Verify your email address</h1>

    <p class="subtitle">
      We’ve sent a verification link to your email.
      Please verify your email to continue using <strong>AngShop</strong>.
    </p>

    <div class="info-box" mat-dialog-content>
      Didn’t receive the email?
      Check your spam folder or click the button below to resend.
    </div>

    <div class="actions">
      <button class="primary">
        Resend verification email
      </button>

      <button class="secondary">
        Logout
      </button>

      <button class="secondary" mat-dialog-close>
        Close
      </button>
    </div>

  </div>

</div>
